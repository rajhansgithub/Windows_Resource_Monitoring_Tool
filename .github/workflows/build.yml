name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.0.0). Empty = build only."
        required: false
        default: ""

permissions:
  contents: write # create GitHub Releases on v* tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release -- --show-output
      - name: Build
        run: cargo build --release
      - name: Run app, screenshot Achievements window
        shell: pwsh
        run: |
          # CI-only state: one badge at every tier, Bronze to Emulsion, so every medal shader shows in the window
          $dir = "$env:LOCALAPPDATA/ResourceMonitor"
          New-Item -ItemType Directory -Force $dir, target/medal-shots | Out-Null
          Set-Content "$dir/achievements.json" '{"v":1,"g":1,"k":{"watch":1,"heavy":2,"render":3,"mover":4,"bandwidth":5,"down":6,"up":7}}'
          $p = Start-Process target/release/ResourceMonitor.exe -ArgumentList "--achievements" -PassThru
          Start-Sleep -Seconds 12
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($x, $y, $w, $h, $file) {
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($x, $y, 0, 0, (New-Object System.Drawing.Size $w, $h))
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Shot $b.X $b.Y $b.Width $b.Height "target/medal-shots/app-screen.png"
          $h = [W]::FindWindowW([NullString]::Value, "Achievements")  # $null would pass ""
          if ($h -ne [IntPtr]::Zero) {
            $r = New-Object W+R
            [void][W]::GetWindowRect($h, [ref]$r)
            Shot $r.L $r.T ($r.Rt - $r.L) ($r.B - $r.T) "target/medal-shots/app-achievements.png"
          }
          $log = "$dir/diagnostics.log"
          if (Test-Path $log) { Copy-Item $log target/medal-shots/; Get-Content $log }
          if ($p.HasExited) { Write-Error "app exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          if ($h -eq [IntPtr]::Zero) { Write-Error "Achievements window did not open"; exit 1 }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "achievements gpu" -Quiet)) {
            Write-Error "GPU badge path failed in the app, see diagnostics.log"; exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medal-shots
          path: target/medal-shots/
          if-no-files-found: warn
      - name: Run app, screenshot the main window on Overview (demo Insights data)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/insights-shots | Out-Null
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W2 {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $env:RESMON_INSIGHTS_DEMO = "1"
          $p = Start-Process target/release/ResourceMonitor.exe -ArgumentList "--insights" -PassThru
          Start-Sleep -Seconds 8
          # One main window: class ResourceMonitor.Main, caption "Resource Monitor".
          $h = [W2]::FindWindowW("ResourceMonitor.Main", [NullString]::Value)
          if ($h -eq [IntPtr]::Zero) { $h = [W2]::FindWindowW([NullString]::Value, "Resource Monitor") }
          if ($h -ne [IntPtr]::Zero) {
            $r = New-Object W2+R
            [void][W2]::GetWindowRect($h, [ref]$r)
            $w = $r.Rt - $r.L; $hh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save("target/insights-shots/main-overview.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          # TEMP-DUMP
          function Dump($f) { $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f)); Write-Output "DUMP-BEGIN $f"; for ($i=0; $i -lt $b.Length; $i+=4000) { Write-Output ("DUMP|" + $b.Substring($i, [Math]::Min(4000, $b.Length-$i))) }; Write-Output "DUMP-END" }
          if ($h -ne [IntPtr]::Zero) {
            Dump "target/insights-shots/main-overview.png"
            $ws = New-Object -ComObject WScript.Shell
            foreach ($k in @(2, 1, 1, 1, 1)) {
              [void]$ws.AppActivate($p.Id); Start-Sleep -Milliseconds 400
              for ($j=0; $j -lt $k; $j++) { [System.Windows.Forms.SendKeys]::SendWait("^{TAB}"); Start-Sleep -Milliseconds 300 }
              Start-Sleep -Seconds 2
              $bmp = New-Object System.Drawing.Bitmap $w, $hh
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
              $f = "target/insights-shots/page-$k-$(Get-Random).png"; $bmp.Save($f, [System.Drawing.Imaging.ImageFormat]::Png); Dump $f
            }
          }
          if ([W2]::FindWindowW("ResourceMonitor.Insights", [NullString]::Value) -ne [IntPtr]::Zero) {
            Write-Error "a separate Insights window opened"; exit 1
          }
          $log = "$env:LOCALAPPDATA/ResourceMonitor/diagnostics.log"
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if ($p.HasExited) { Write-Error "app exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          if ($h -eq [IntPtr]::Zero) { Write-Error "Main window did not open"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insights-shots
          path: target/insights-shots/
          if-no-files-found: warn
      - name: Run app, screenshot the Server Room (Achievements page) and the Overview goal card
        shell: pwsh
        run: |
          # CI-only state, like a new user's first week: a few Bronze units, three singles, counters part way.
          $dir = "$env:LOCALAPPDATA/ResourceMonitor"
          New-Item -ItemType Directory -Force $dir, target/room-shots | Out-Null
          Set-Content "$dir/achievements.json" '{"v":1,"u":{"power_on":1764000000000,"first_gb":1764000000000,"running_hot":1764000000000},"k":{"watch":1,"bandwidth":1,"down":1,"up":1,"taskmaster":1},"c":{"min":1860,"cpu_min":36,"gpu_min":18,"disk_b":38000000000,"net_b":64000000000,"down_b":52000000000,"up_b":4000000000,"game_min":180,"tasks":2}}'
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W3 {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process target/release/ResourceMonitor.exe -ArgumentList "--insights" -PassThru
          Start-Sleep -Seconds 8
          $h = [W3]::FindWindowW("ResourceMonitor.Main", [NullString]::Value)
          function Grab($file) {
            $r = New-Object W3+R
            [void][W3]::GetWindowRect($h, [ref]$r)
            $w = $r.Rt - $r.L; $hh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          # TEMP-ROOM-DUMP (remove before merge): PNGs as base64 in the log, artifact download is blocked for the cloud session
          function Dump($f) { $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f)); Write-Output "ROOM-BEGIN $f"; for ($i=0; $i -lt $b.Length; $i+=4000) { Write-Output ("ROOM|" + $b.Substring($i, [Math]::Min(4000, $b.Length-$i))) }; Write-Output "ROOM-END" }
          if ($h -ne [IntPtr]::Zero) {
            Grab "target/room-shots/overview.png"; Dump "target/room-shots/overview.png"
            $ws = New-Object -ComObject WScript.Shell
            [void]$ws.AppActivate($p.Id); Start-Sleep -Milliseconds 400
            [System.Windows.Forms.SendKeys]::SendWait("^{TAB}"); Start-Sleep -Seconds 2
            Grab "target/room-shots/server-room.png"; Dump "target/room-shots/server-room.png"
          }
          $log = "$dir/diagnostics.log"
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if ($p.HasExited) { Write-Error "app exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          if ($h -eq [IntPtr]::Zero) { Write-Error "Main window did not open"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-shots
          path: target/room-shots/
          if-no-files-found: warn
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ResourceMonitor
          path: |
            target/release/ResourceMonitor.exe
            dist/Setup_ResourceMonitor.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Resource Monitor ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/ResourceMonitor.exe
            dist/Setup_ResourceMonitor.exe
