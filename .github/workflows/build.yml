name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.0.0). Empty = build only."
        required: false
        default: ""

permissions:
  contents: write # create GitHub Releases on v* tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release -- --show-output
      - name: Build
        run: cargo build --release
      - name: Run app, screenshot the live coin on the Achievements page, one per tier
        shell: pwsh
        run: |
          # CI-only state: one badge at every tier, Bronze to Emulsion, so every coin shader shows in the tray
          $dir = "$env:LOCALAPPDATA/ResourceMonitor"
          New-Item -ItemType Directory -Force $dir, target/medal-shots | Out-Null
          # struck a few days ago, so the coins show a little dust, not years of it
          $t = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - 3 * 3600000
          $ids = "watch","heavy","render","mover","bandwidth","down","up"
          $u = ($ids | ForEach-Object { '"' + $_ + '":' + $t }) -join ","
          Set-Content "$dir/achievements.json" ('{"v":1,"g":1,"u":{' + $u + '},"k":{"watch":1,"heavy":2,"render":3,"mover":4,"bandwidth":5,"down":6,"up":7}}')
          $p = Start-Process target/release/ResourceMonitor.exe -ArgumentList "--achievements" -PassThru
          Start-Sleep -Seconds 12
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, int x, int y, uint d, UIntPtr e);
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $h = [W]::FindWindowW("ResourceMonitor.Window", [NullString]::Value)
          function Grab($file) {
            $r = New-Object W+R
            [void][W]::GetWindowRect($h, [ref]$r)
            $w = $r.Rt - $r.L; $hh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          function Click($x, $y) {
            $r = New-Object W+R
            [void][W]::GetWindowRect($h, [ref]$r)
            [void][W]::SetCursorPos($r.L + $x, $r.T + $y); Start-Sleep -Milliseconds 150
            [W]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 60
            [W]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 300
          }
          if ($h -ne [IntPtr]::Zero) {
            $ws = New-Object -ComObject WScript.Shell
            [void]$ws.AppActivate($p.Id); Start-Sleep -Milliseconds 400
            Grab "target/medal-shots/page.png"
            # units of racks 01 and 02 (window coordinates at the default size, page scrolled to the top)
            # stones first, metals last: on a first start the coin programs take a few seconds to compile (cached after)
            $units = @(@{n="5-bandwidth";x=820;y=272}, @{n="6-down";x=820;y=324}, @{n="7-up";x=820;y=376}, @{n="1-watch";x=500;y=272}, @{n="2-heavy";x=500;y=324}, @{n="3-render";x=500;y=376}, @{n="4-mover";x=500;y=428})
            foreach ($u in $units) {
              [System.Windows.Forms.SendKeys]::SendWait("{HOME}"); Start-Sleep -Milliseconds 600
              Click $u.x $u.y
              [System.Windows.Forms.SendKeys]::SendWait("{END}"); Start-Sleep -Seconds 3
              Grab "target/medal-shots/coin-$($u.n).png"
            }
            # drag across the coin (turns it), then a click (turns it over)
            $r = New-Object W+R
            [void][W]::GetWindowRect($h, [ref]$r)
            [void][W]::SetCursorPos($r.L + 430, $r.T + 580); Start-Sleep -Milliseconds 150
            [W]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero)
            for ($i = 1; $i -le 12; $i++) { [void][W]::SetCursorPos($r.L + 430 + 8 * $i, $r.T + 580); Start-Sleep -Milliseconds 30 }
            [W]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 250
            Grab "target/medal-shots/coin-dragged.png"
            Start-Sleep -Seconds 3
            Click 430 580; Start-Sleep -Seconds 2
            Grab "target/medal-shots/coin-flipped.png"
          }
          $log = "$dir/diagnostics.log"
          if (Test-Path $log) { Copy-Item $log target/medal-shots/; Get-Content $log }
          if ($p.HasExited) { Write-Error "app exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          if ($h -eq [IntPtr]::Zero) { Write-Error "Main window did not open"; exit 1 }
          if ([W]::FindWindowW("ResourceMonitor.Achievements", [NullString]::Value) -ne [IntPtr]::Zero) { Write-Error "a separate Achievements window opened"; exit 1 }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "achievements gpu" -Quiet)) {
            Write-Error "GPU badge path failed in the app, see diagnostics.log"; exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medal-shots
          path: target/medal-shots/
          if-no-files-found: warn
      - name: Run app, Achievements maximized, small, and the large medal view
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA/ResourceMonitor"
          New-Item -ItemType Directory -Force $dir, target/big-shots | Out-Null
          $t = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - 20 * 3600000
          $ids = "watch","heavy","render","mover","bandwidth","down","up"
          $u = ($ids | ForEach-Object { '"' + $_ + '":' + $t }) -join ","
          Set-Content "$dir/achievements.json" ('{"v":1,"g":1,"u":{' + $u + '},"k":{"watch":1,"heavy":2,"render":3,"mover":4,"bandwidth":5,"down":6,"up":7}}')
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class WB {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int w, int hh, uint f);
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Grab($h, $file) {
            $r = New-Object WB+R
            [void][WB]::GetWindowRect($h, [ref]$r)
            $w = $r.Rt - $r.L; $hh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          $fails = @()
          foreach ($mode in "racks", "big") {
            if ($mode -eq "big") { $env:RESMON_ACH_BIG = "1" } else { Remove-Item Env:RESMON_ACH_BIG -ErrorAction SilentlyContinue }
            $p = Start-Process target/release/ResourceMonitor.exe -ArgumentList "--achievements" -PassThru
            Start-Sleep -Seconds 10
            $h = [WB]::FindWindowW("ResourceMonitor.Window", [NullString]::Value)
            if ($h -eq [IntPtr]::Zero) { $fails += "$mode : main window did not open" } else {
              [void][WB]::ShowWindow($h, 3); Start-Sleep -Seconds 4
              Grab $h "target/big-shots/$mode-max.png"
              [void][WB]::ShowWindow($h, 9); Start-Sleep -Milliseconds 500
              [void][WB]::SetWindowPos($h, [IntPtr]::Zero, 40, 40, 720, 560, 0x14); Start-Sleep -Seconds 4
              Grab $h "target/big-shots/$mode-small.png"
            }
            if ($p.HasExited) { $fails += "$mode : app exited early (code $($p.ExitCode))" } else { Stop-Process -Id $p.Id; Start-Sleep -Seconds 2 }
          }
          $log = "$dir/diagnostics.log"
          if (Test-Path $log) { Get-Content $log -Tail 20 }
          if ($fails.Count -gt 0) { $fails | ForEach-Object { Write-Error $_ }; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-shots
          path: target/big-shots/
          if-no-files-found: warn
      - name: Run app, screenshot the main window on Overview (demo Insights data)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/insights-shots | Out-Null
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W2 {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $env:RESMON_INSIGHTS_DEMO = "1"
          $p = Start-Process target/release/ResourceMonitor.exe -ArgumentList "--insights" -PassThru
          Start-Sleep -Seconds 8
          # One main window: class ResourceMonitor.Window, caption "Resource Monitor".
          $h = [W2]::FindWindowW("ResourceMonitor.Window", [NullString]::Value)
          if ($h -eq [IntPtr]::Zero) { $h = [W2]::FindWindowW([NullString]::Value, "Resource Monitor") }
          if ($h -ne [IntPtr]::Zero) {
            $r = New-Object W2+R
            [void][W2]::GetWindowRect($h, [ref]$r)
            $w = $r.Rt - $r.L; $hh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save("target/insights-shots/main-overview.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          if ([W2]::FindWindowW("ResourceMonitor.Insights", [NullString]::Value) -ne [IntPtr]::Zero) {
            Write-Error "a separate Insights window opened"; exit 1
          }
          $log = "$env:LOCALAPPDATA/ResourceMonitor/diagnostics.log"
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if ($p.HasExited) { Write-Error "app exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          if ($h -eq [IntPtr]::Zero) { Write-Error "Main window did not open"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insights-shots
          path: target/insights-shots/
          if-no-files-found: warn
      - name: Run app, screenshot the main window maximized and at the default size (demo Insights data)
        shell: pwsh
        run: |
          # Wide layouts need a wide screen. Raise the runner's display to its largest mode (put back at the end),
          # and log the size so a small runner is easy to spot in the shots.
          New-Item -ItemType Directory -Force target/wide-shots | Out-Null
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W5 {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            public struct DM {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n);
            [DllImport("user32.dll")] public static extern int GetSystemMetrics(int i);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern bool EnumDisplaySettingsW(string dev, int mode, ref DM dm);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int ChangeDisplaySettingsW(ref DM dm, int flags);
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function NewDm() {
            $d = New-Object W5+DM
            $d.dmSize = [int16][System.Runtime.InteropServices.Marshal]::SizeOf($d)
            return $d
          }
          $orig = NewDm
          [void][W5]::EnumDisplaySettingsW([NullString]::Value, -1, [ref]$orig)
          Write-Host "screen before: $($orig.dmPelsWidth)x$($orig.dmPelsHeight)"
          try {
            $best = $orig
            for ($i = 0; $i -lt 400; $i++) {
              $m = NewDm
              if (-not [W5]::EnumDisplaySettingsW([NullString]::Value, $i, [ref]$m)) { break }
              if ($m.dmBitsPerPel -eq 32 -and $m.dmPelsWidth * $m.dmPelsHeight -gt $best.dmPelsWidth * $best.dmPelsHeight) { $best = $m }
            }
            if ($best.dmPelsWidth -gt $orig.dmPelsWidth) {
              $rc = [W5]::ChangeDisplaySettingsW([ref]$best, 0)
              Write-Host "display change to $($best.dmPelsWidth)x$($best.dmPelsHeight): code $rc"
              Start-Sleep -Seconds 3
            }
          } catch { Write-Host "display change skipped: $_" }
          Write-Host "screen now: $([W5]::GetSystemMetrics(0))x$([W5]::GetSystemMetrics(1))"
          function Grab($h, $file) {
            $r = New-Object W5+R
            [void][W5]::GetWindowRect($h, [ref]$r)
            $w = $r.Rt - $r.L; $hh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "$file ${w}x${hh}"
          }
          $env:RESMON_INSIGHTS_DEMO = "1"
          $fails = @()
          # RESMON_PAGE (demo mode only) opens each page directly.
          $pages = @("overview", "incidents", "sleep", "heldback", "ghost", "general", "alerts", "metrics", "about")
          foreach ($mode in "default", "maximized") {
            $n = 0
            foreach ($pg in $pages) {
              $n++
              $env:RESMON_PAGE = $pg
              $p = Start-Process target/release/ResourceMonitor.exe -ArgumentList "--insights" -PassThru
              Start-Sleep -Seconds 6
              $h = [W5]::FindWindowW("ResourceMonitor.Window", [NullString]::Value)
              if ($h -eq [IntPtr]::Zero) { $fails += "$mode $pg : main window did not open" } else {
                if ($mode -eq "maximized") { [void][W5]::ShowWindow($h, 3); Start-Sleep -Seconds 2 }
                Grab $h "target/wide-shots/$mode-$n-$pg.png"
              }
              if ($p.HasExited) { $fails += "$mode $pg : app exited early (code $($p.ExitCode))" } else { Stop-Process -Id $p.Id; Start-Sleep -Seconds 2 }
            }
          }
          Remove-Item Env:RESMON_PAGE
          # Put the display back for the steps that follow.
          try { [void][W5]::ChangeDisplaySettingsW([ref]$orig, 0) } catch { Write-Host "display restore skipped: $_" }
          $log = "$env:LOCALAPPDATA/ResourceMonitor/diagnostics.log"
          if (Test-Path $log) { Get-Content $log -Tail 20 }
          if ($fails.Count -gt 0) { $fails | ForEach-Object { Write-Error $_ }; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-shots
          path: target/wide-shots/
          if-no-files-found: warn
      - name: Run app, screenshot the Server Room (Achievements page) and the Overview goal card
        shell: pwsh
        run: |
          # CI-only state, like a new user's first week: a few Bronze units, three singles, counters part way.
          $dir = "$env:LOCALAPPDATA/ResourceMonitor"
          New-Item -ItemType Directory -Force $dir, target/room-shots | Out-Null
          Set-Content "$dir/achievements.json" '{"v":1,"u":{"power_on":1764000000000,"first_gb":1764000000000,"running_hot":1764000000000},"k":{"watch":1,"bandwidth":1,"down":1,"up":1,"taskmaster":1},"c":{"min":1860,"cpu_min":36,"gpu_min":18,"disk_b":38000000000,"net_b":64000000000,"down_b":52000000000,"up_b":4000000000,"game_min":180,"tasks":2}}'
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W3 {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process target/release/ResourceMonitor.exe -ArgumentList "--insights" -PassThru
          Start-Sleep -Seconds 8
          $h = [W3]::FindWindowW("ResourceMonitor.Window", [NullString]::Value)
          function Grab($file) {
            $r = New-Object W3+R
            [void][W3]::GetWindowRect($h, [ref]$r)
            $w = $r.Rt - $r.L; $hh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          if ($h -ne [IntPtr]::Zero) {
            Grab "target/room-shots/overview.png"
            $ws = New-Object -ComObject WScript.Shell
            [void]$ws.AppActivate($p.Id); Start-Sleep -Milliseconds 400
            [System.Windows.Forms.SendKeys]::SendWait("^{TAB}"); Start-Sleep -Seconds 2
            Grab "target/room-shots/server-room.png"
          }
          $log = "$dir/diagnostics.log"
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if ($p.HasExited) { Write-Error "app exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          if ($h -eq [IntPtr]::Zero) { Write-Error "Main window did not open"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-shots
          path: target/room-shots/
          if-no-files-found: warn
      - name: Run app, screenshot the tray details panel (popup)
        shell: pwsh
        run: |
          # CI-only state: two weeks of data usage so the day bars have something to show.
          $dir = "$env:LOCALAPPDATA/ResourceMonitor"
          New-Item -ItemType Directory -Force $dir, target/popup-shots | Out-Null
          $rows = for ($i = 13; $i -ge 1; $i--) {
            $d = (Get-Date).AddDays(-$i).ToString("yyyy-MM-dd")
            $recv = [int64](800MB + ($i * 7919 % 13) * 2.6GB); $sent = [int64]($recv * 0.08)
            "$d,$sent,$recv"
          }
          Set-Content "$dir/usage.csv" ($rows -join "`n")
          # Taskbar widget with meters (later lines win in settings.ini).
          Add-Content "$dir/settings.ini" "`nlabel_style = meters`ntheme = dark`nmax_width_pct = 50`nbg_opacity = 255`n"
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W4 {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowExW(IntPtr p, IntPtr a, string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, int x, int y, uint d, UIntPtr e);
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process target/release/ResourceMonitor.exe -PassThru
          Start-Sleep -Seconds 12
          # A second launch asks the running app to show the panel, pinned.
          Start-Process target/release/ResourceMonitor.exe; Start-Sleep -Seconds 3
          $h = [W4]::FindWindowW("ResourceMonitor.Popup", [NullString]::Value)
          function Grab($file, $win = $h) {
            $r = New-Object W4+R
            [void][W4]::GetWindowRect($win, [ref]$r)
            $w = $r.Rt - $r.L; $hh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          if ($h -ne [IntPtr]::Zero) {
            Grab "target/popup-shots/popup.png"
            $r = New-Object W4+R
            [void][W4]::GetWindowRect($h, [ref]$r)
            # Memory tab of the top list, then hover the network chart (tooltip).
            [void][W4]::SetCursorPos($r.L + 280, $r.B - 136); Start-Sleep -Milliseconds 200
            [W4]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 60
            [W4]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 400
            [void][W4]::SetCursorPos($r.L + 300, $r.T + 240); Start-Sleep -Seconds 1
            Grab "target/popup-shots/popup-hover.png"
            # Docked widget is a child of the taskbar; floating, a top-level window.
            $ov = [W4]::FindWindowExW([W4]::FindWindowW("Shell_TrayWnd", [NullString]::Value), [IntPtr]::Zero, "ResourceMonitor.Overlay", [NullString]::Value)
            if ($ov -eq [IntPtr]::Zero) { $ov = [W4]::FindWindowW("ResourceMonitor.Overlay", [NullString]::Value) }
            if ($ov -ne [IntPtr]::Zero) { Grab "target/popup-shots/widget-meters.png" $ov }
            # Light (eggshell) theme, meters and text on the widget.
            Add-Content "$dir/settings.ini" "`nlabel_style = both`ntheme = light`n"
            Start-Sleep -Seconds 6
            Grab "target/popup-shots/popup-light.png"
            if ($ov -ne [IntPtr]::Zero) { Grab "target/popup-shots/widget-both.png" $ov }
          }
          $log = "$dir/diagnostics.log"
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if ($p.HasExited) { Write-Error "app exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          if ($h -eq [IntPtr]::Zero) { Write-Error "Details panel did not open"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popup-shots
          path: target/popup-shots/
          if-no-files-found: warn
      - name: Run app, screenshot the Monitor page maximized, small and light
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA/ResourceMonitor"
          New-Item -ItemType Directory -Force $dir, target/monitor-shots | Out-Null
          Add-Content "$dir/settings.ini" "`ntheme = dark`n"
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W5 {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)] public struct DM {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string Name;
              public short Spec, Drv, Size, Extra; public int Fields, PosX, PosY, Orient, Fixed;
              public short Color, Duplex, YRes, TT, Collate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string Form;
              public short LogPx; public int Bpp, W, H, Flags, Freq, Icm, Intent, Media, Dither, R1, R2, PanW, PanH;
            }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int w, int hh, uint f);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, int x, int y, int d, UIntPtr e);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern bool EnumDisplaySettingsW(string d, int m, ref DM dm);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int ChangeDisplaySettingsW(ref DM dm, int f);
            public static int Res(int w, int h) {
              var dm = new DM(); dm.Size = (short)Marshal.SizeOf(typeof(DM));
              if (!EnumDisplaySettingsW(null, -1, ref dm)) return -99;
              dm.W = w; dm.H = h; dm.Fields = 0x80000 | 0x100000;
              return ChangeDisplaySettingsW(ref dm, 0);
            }
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Grab($h, $file) {
            $r = New-Object W5+R
            [void][W5]::GetWindowRect($h, [ref]$r)
            $w = $r.Rt - $r.L; $hh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          function Scroll($h, $name, $n, $d) {
            $r = New-Object W5+R
            [void][W5]::GetWindowRect($h, [ref]$r)
            [void][W5]::SetCursorPos([int](($r.L + $r.Rt) / 2 + 100), [int](($r.T + $r.B) / 2))
            foreach ($k in 1..$n) {
              [W5]::mouse_event(0x0800, 0, 0, $d, [UIntPtr]::Zero); Start-Sleep -Seconds 2
              Grab $h "target/monitor-shots/$name-s$k.png"
            }
            [W5]::mouse_event(0x0800, 0, 0, 12000, [UIntPtr]::Zero); Start-Sleep -Seconds 1
          }
          $p = Start-Process target/release/ResourceMonitor.exe -ArgumentList "--monitor" -PassThru
          Start-Sleep -Seconds 6
          $h = [W5]::FindWindowW("ResourceMonitor.Window", [NullString]::Value)
          if ($h -ne [IntPtr]::Zero) {
            # Some load so the charts move.
            $job = Start-Job { $e = (Get-Date).AddSeconds(40); while ((Get-Date) -lt $e) { [math]::Sqrt(12345) | Out-Null } }
            Write-Output ("res 1920x1080: " + [W5]::Res(1920, 1080)); Start-Sleep -Seconds 2
            Write-Output ("screen " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds)
            [void][W5]::ShowWindow($h, 3); Start-Sleep -Seconds 16
            Grab $h "target/monitor-shots/wide.png"
            Scroll $h "wide" 5 -1500
            Write-Output ("res 2560x1440: " + [W5]::Res(2560, 1440)); Start-Sleep -Seconds 4
            Write-Output ("screen " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds)
            Grab $h "target/monitor-shots/xl.png"
            [void][W5]::Res(1920, 1080); Start-Sleep -Seconds 2
            [void][W5]::ShowWindow($h, 9); Start-Sleep -Milliseconds 500
            [void][W5]::SetWindowPos($h, [IntPtr]::Zero, 40, 40, 900, 1000, 0x14); Start-Sleep -Seconds 3
            Grab $h "target/monitor-shots/small.png"
            Scroll $h "small" 7 -1500
            # Reflow animation: maximize and catch the cards mid-move.
            [void][W5]::ShowWindow($h, 3); Start-Sleep -Milliseconds 120
            Grab $h "target/monitor-shots/anim-mid.png"
            Start-Sleep -Seconds 1
            [void][W5]::ShowWindow($h, 9); Start-Sleep -Milliseconds 500
            Add-Content "$dir/settings.ini" "`ntheme = light`n"
            [void][W5]::SetWindowPos($h, [IntPtr]::Zero, 20, 20, 1500, 1000, 0x14); Start-Sleep -Seconds 6
            Grab $h "target/monitor-shots/light.png"
            Scroll $h "light" 2 -1800
            Stop-Job $job -ErrorAction SilentlyContinue
          }
          $log = "$dir/diagnostics.log"
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if ($p.HasExited) { Write-Error "app exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          if ($h -eq [IntPtr]::Zero) { Write-Error "Main window did not open"; exit 1 }
