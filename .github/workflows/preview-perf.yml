name: preview-perf

# Temporary: measures how fast the achievements preview page loads in Chrome on Windows (ANGLE / D3D shader compiles).
on:
  push:
    branches: ["claude/verify-medal-shaders"]
    paths: ["docs/perf/**", "docs/preview/**", ".github/preview-perf/**", ".github/workflows/preview-perf.yml"]
  workflow_dispatch:

jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright
        working-directory: .github/preview-perf
        run: npm init -y; npm i playwright@1.47.2
      - name: Measure (Chrome, D3D11 WARP)
        shell: pwsh
        working-directory: .github/preview-perf
        env: { PW_CHANNEL: chrome }
        run: |
          foreach ($f in @("../../docs/perf/before.html", "../../docs/preview/index.html")) {
            if (Test-Path $f) {
              node measure.js $f "$f d3d11-warp" --use-angle=d3d11-warp --ignore-gpu-blocklist
              node measure.js $f "$f default"
            }
          }
