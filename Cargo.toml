[package]
name = "resmon"
version = "2.16.1"
edition = "2021"
authors = ["Emulsion Labs"]
description = "Ultra-light taskbar resource monitor for Windows 10/11"
license = "MIT"
build = "build.rs"

[[bin]]
name = "ResourceMonitor"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_EventLog",
  "Win32_System_Time",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Wdk_Graphics_Direct3D",
]

# COM bindings for UI Automation (locating taskbar app buttons). Shares
# windows-targets with windows-sys, so it adds little to the binary.
[dependencies.windows]
version = "0.58"
features = [
  "Win32_UI_Accessibility", "Win32_System_Com", "Win32_Foundation",
  # D3D11 badge shaders (src/achievements/gpu.rs)
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
