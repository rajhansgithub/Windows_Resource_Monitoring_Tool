<title>Resource Monitor Achievements</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
<div class="wrap">
<div class="vbar-wrap"><div class="vbar-in"><span class="vlabel" id="vlab">Versions</span><div id="vtabs" role="tablist" aria-labelledby="vlab" style="display:contents"></div><p class="vnote" id="vnote"></p></div></div>
<main id="panels"></main>
</div>
<div class="fv" id="fv" role="dialog" aria-modal="true" aria-label="Medal full view" hidden>
  <button class="fv-x" id="fvX" type="button" aria-label="Close full view">✕</button>
  <button class="fv-nav prev" id="fvP" type="button" aria-label="Previous medal">‹</button>
  <button class="fv-nav next" id="fvN" type="button" aria-label="Next medal">›</button>
  <div class="fv-main" id="fvMain">
    <div class="fv-stage" id="fvStage">
      <div class="fv-slab" id="fvSlab" role="button" tabindex="0" aria-label="Medal. Click to turn it over">
        <div class="fv-edge" id="fvEdge" aria-hidden="true"></div>
        <div class="fv-front" id="fvFront" aria-hidden="true"></div>
        <div class="fv-back" id="fvBack"></div>
      </div>
      <div class="fv-floor" id="fvFloor" aria-hidden="true"></div>
    </div>
    <aside class="fv-card" id="fvCard"></aside>
  </div>
</div>
<div class="mo" id="mo" role="dialog" aria-modal="true" aria-label="Badge unlocked" tabindex="-1" hidden></div>
<div class="lu" id="lu" role="dialog" aria-modal="true" aria-label="Level up" tabindex="-1" hidden></div>
<script src="js/gl.js"></script>
<script src="js/age.js"></script>
<script src="js/3d.js"></script>
<script src="js/app.js"></script>
