<title>Resource Monitor Achievements</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Resource Monitor Achievements: the one living page. Layout = a sticky versions bar, then the selected version's panel.
   Colours are tokens on :root (dark-first, a single look). Each version is a panel built from its own settings; the shader engines load once. */
:root {
  --bg: #0d0f12; --panel: #15181d; --panel2: #1b1f26; --line: #2a303a; --fg: #eef1f5; --dim: #9aa3b0; --accent: #5ad1ff;
  --ok: #59d98e; --warn: #eac35e; --bad: #ff7a85;
  --m1: #c07f45; --m2: #c9cfd8; --m3: #eac35e; --m4: #a9e4e1; --m5: #cbe7ff; --m6: #ff4757;
  --m7: linear-gradient(135deg, #ff9ad5, #8be9ff, #ffe48a, #b49cff, #8dffc7);
  --d1: #9fd7ff; --d2: #a3ecf1; --d3: #c5c7ff; --d4: #bb97c9;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }
canvas { display: block; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 0 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* versions bar */
.vbar-wrap { position: sticky; top: 0; z-index: 20; background: rgba(13, 15, 18, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.vbar-in { max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.vlabel { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-right: 4px; }
.vtab { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-family: var(--display); font-weight: 600; font-size: 14px; cursor: pointer; color: var(--dim); }
.vtab[aria-selected="true"] { color: var(--fg); border-color: var(--accent); background: #12212b; }
.vtab .cur { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-left: 8px; }
.vnote { color: var(--dim); font-size: 12.5px; flex-basis: 100%; }
.panel { display: grid; gap: 30px; padding-top: 28px; }

/* shared pieces */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.sec-h { display: grid; gap: 6px; margin-bottom: 14px; }
.sec-h h2 { font-size: clamp(20px, 3vw, 26px); }
.sec-h p { color: var(--dim); max-width: 74ch; }
.demo { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--warn); border: 1px dashed #5b4f25; border-radius: 6px; padding: 2px 8px; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chips span { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; font-family: var(--display); font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: #12303f; border-color: #2a6f8f; }
.is-nogl::after { content: "Shader unavailable on this device"; font-size: 11px; color: var(--dim); }

/* hero */
.hero2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 28px; align-items: center; }
.hero2 h1 { font-size: clamp(28px, 4.2vw, 44px); letter-spacing: .01em; margin-bottom: 10px; }
.hero2 p.lead { color: var(--dim); max-width: 62ch; }
.hero2 p.lead b { color: var(--fg); font-weight: 600; }
.herobadge { display: grid; justify-items: center; gap: 4px; }
.herobadge button { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 16px; }
.herobadge canvas { width: 280px; height: 280px; max-width: 100%; }
.herobadge .cap { font-family: var(--mono); font-size: 12px; color: var(--dim); text-align: center; margin-top: 8px; }
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; margin-top: 18px; }
.tile { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 4px 10px; display: grid; justify-items: center; gap: 2px; cursor: pointer; }
.tile:hover { border-color: #3b4452; }
.tile canvas { width: 76px; height: 76px; max-width: 100%; }
.tile span { font-size: 12px; color: var(--dim); }
.tile i { display: block; width: 18px; height: 3px; border-radius: 2px; margin-top: 2px; }

/* rack plates: a 1U 19-inch rack faceplate, dark brushed steel, rack ears with screw slots, status LEDs and vents drawn in CSS */
.plates { display: grid; gap: 18px; }
.rack { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; border-radius: 6px; border: 1px solid #4b525c;
  background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .03) 0 1px, rgba(0, 0, 0, .05) 1px 2px), linear-gradient(180deg, #3a4048, #23272d 50%, #2c3239);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 -3px 8px rgba(0, 0, 0, .55), 0 12px 28px rgba(0, 0, 0, .45); }
.ear { display: grid; align-content: space-between; justify-items: center; padding: 14px 0; background: linear-gradient(90deg, rgba(0, 0, 0, .25), rgba(255, 255, 255, .04)); }
.rack > .ear:last-child { background: linear-gradient(270deg, rgba(0, 0, 0, .25), rgba(255, 255, 255, .04)); }
.hole { width: 11px; height: 22px; border-radius: 6px; background: #05070a; box-shadow: inset 0 2px 3px rgba(0, 0, 0, .95), 0 1px 0 rgba(255, 255, 255, .12); }
.rack-mid { padding: 14px 6px 14px; min-width: 0; }
.rack-top { display: flex; align-items: center; gap: 12px; margin: 0 6px 12px; }
.leds { display: inline-flex; gap: 6px; }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); flex: none; }
.led.amber { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.led.off { background: #3a2a2e; box-shadow: none; }
.vents { display: flex; gap: 5px; height: 16px; flex: 1; min-width: 0; justify-content: flex-end; }
.vents i { width: 6px; max-width: 6px; flex: 1 1 6px; border-radius: 3px; background: #06080a; box-shadow: inset 0 2px 3px rgba(0, 0, 0, .95), 0 1px 0 rgba(255, 255, 255, .09); }
.rack-name { font-family: var(--display); font-weight: 700; letter-spacing: .02em; font-size: 15px; text-shadow: 0 -1px 0 rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 255, 255, .12); color: #cfd5dd; white-space: nowrap; }
.wells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.well { border-radius: 8px; padding: 8px 2px 8px; display: grid; justify-items: center; gap: 1px; background: #12151a; box-shadow: inset 0 3px 8px rgba(0, 0, 0, .85), inset 0 -1px 0 rgba(255, 255, 255, .06), 0 1px 0 rgba(255, 255, 255, .1); min-width: 0; }
.well canvas { width: 112px; height: 112px; max-width: 100%; }
.well .empty { width: 78%; aspect-ratio: 1; border: 2px dashed #3a414b; border-radius: 50%; margin: 4px 0 6px; display: grid; place-items: center; color: #5b6571; font-family: var(--mono); font-size: 12px; }
.well b { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.25; }
.well small { font-size: 11px; color: var(--dim); text-align: center; }
.nameplate { margin: 12px 6px 0; padding: 9px 14px; border-radius: 5px; background: linear-gradient(180deg, #c9ced6, #9aa1ab); color: #14181d; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; align-items: center; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 2px 5px rgba(0, 0, 0, .5); }
.nameplate .pt { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .02em; }
.nameplate .nx { font-family: var(--mono); font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.nx .mp { display: inline-flex; gap: 3px; } .nx .mp i { width: 9px; height: 9px; border-radius: 50%; background: #6c737d; } .nx .mp i.on { background: #14181d; }

/* badge tab mock */
.win { border: 1px solid #323945; border-radius: 12px; overflow: hidden; background: var(--bg); box-shadow: 0 14px 34px rgba(0, 0, 0, .45); }
.win-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #1a1e25; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--dim); }
.win-bar b { color: var(--fg); font-weight: 600; font-family: var(--display); }
.win-bar .gl { margin-left: auto; font-family: var(--mono); letter-spacing: .5em; }
.win-body { display: grid; grid-template-columns: 150px minmax(0, 1fr); }
.snav { background: #12151a; border-right: 1px solid var(--line); padding: 12px 8px; display: grid; gap: 2px; align-content: start; font-size: 13px; }
.snav div { padding: 7px 10px; border-radius: 8px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.snav div.on { background: #1d232c; color: var(--fg); }
.rank-pill { font-family: var(--mono); font-size: 11px; font-weight: 500; border-radius: 999px; padding: 1px 8px; color: #1d1507; background: var(--m3); white-space: nowrap; }
.tabmain { padding: 16px; display: grid; gap: 16px; min-width: 0; }
.lvhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ring { position: relative; width: 64px; height: 64px; flex: none; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 22px; }
.lvhead .rk { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--m3); }
.lvhead .xp { font-size: 12.5px; color: var(--dim); font-family: var(--mono); }
.lvhead .sp { flex: 1; }
.gate { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.gate h3 { font-size: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.gate h3 .emu { width: 14px; height: 14px; border-radius: 50%; background: var(--m7); display: inline-block; }
.gate p.s { color: var(--dim); font-size: 13px; }
.cond { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.cond .tk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #3a424e; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: transparent; margin-top: 1px; }
.cond.met .tk { border-color: var(--ok); background: #123a25; color: var(--ok); }
.cond b { font-weight: 600; font-size: 14px; }
.cond .vals { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--mono); font-size: 12.5px; color: var(--dim); }
.cond .vals .met { color: var(--ok); }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.cat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 8px; min-width: 0; }
.cat.wide { grid-column: 1 / -1; }
.cat h3 { font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.cat h3 small { font-family: var(--mono); font-size: 11px; color: var(--dim); font-weight: 500; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 6px; border-top: 1px solid var(--line); border-radius: 10px; }
.row.earned { cursor: pointer; }
.row.earned:hover { background: #1b2027; }
.rb { width: 64px; height: 64px; display: grid; place-items: center; overflow: visible; }
.rb canvas { width: 64px; height: 64px; }
.rb .ph { width: 52px; height: 52px; border: 2px dashed #3a414b; border-radius: 50%; display: grid; place-items: center; color: #6a7380; font-family: var(--display); font-weight: 700; font-size: 16px; }
.rtitle { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.rtitle .tg { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--dim); margin-left: 6px; letter-spacing: .04em; }
.rline { color: var(--dim); font-size: 12.5px; line-height: 1.35; }
.rbar { height: 5px; border-radius: 3px; background: #262c35; overflow: hidden; margin-top: 6px; }
.rbar i { display: block; height: 100%; border-radius: 3px; }
.rmeta { display: flex; justify-content: space-between; align-items: center; gap: 6px 10px; flex-wrap: wrap; margin-top: 5px; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: #2c333d; }
.rnext { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
.xpc { font-family: var(--mono); font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.more { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); color: var(--accent); padding: 9px; cursor: pointer; font-family: var(--display); font-weight: 600; }

/* moments */
.moments { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* v4: verified on Windows */
.vf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.vf { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px 12px; display: grid; justify-items: center; gap: 3px; align-content: start; cursor: pointer; text-align: center; }
.vf:hover { border-color: #3b4452; }
.vf canvas { width: 112px; height: 112px; max-width: 100%; }
.vf b { font-family: var(--display); font-size: 14px; }
.vf small { font-size: 11.5px; color: var(--dim); }
.vf .ok { font-family: var(--mono); font-size: 11px; color: var(--ok); }
.vf dl { margin: 2px 0 0; display: grid; grid-template-columns: auto auto; gap: 1px 8px; font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: left; }
.vf dd { margin: 0; color: var(--fg); }
.vf .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid rgba(255, 255, 255, .2); }
.vf-checks { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 0; }
.vf-checks li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.vf-checks .tk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; border: 2px solid var(--ok); background: #123a25; color: var(--ok); }
.vf-checks b { font-weight: 600; }
.vf-checks span.nt { grid-column: 2; color: var(--dim); font-size: 12.5px; }
.vf-checks code, .vf p code { font-family: var(--mono); font-size: 12px; }
.vf-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.vf-links a { font-family: var(--mono); font-size: 12px; color: var(--accent); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; text-decoration: none; }
.vf-links a:hover { border-color: var(--accent); }

/* build status */
.bs-sum { display: flex; flex-wrap: wrap; gap: 8px 14px; font-family: var(--mono); font-size: 12.5px; margin-bottom: 10px; }
.bs-bar { height: 8px; border-radius: 4px; background: #262c35; overflow: hidden; display: flex; margin-bottom: 14px; }
.bs-bar i { display: block; height: 100%; }
.bs-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.bs-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.bs-list li b { font-weight: 600; }
.bs-list li span.nt { grid-column: 1; color: var(--dim); font-size: 12.5px; }
.st { font-family: var(--mono); font-size: 11.5px; font-weight: 500; padding: 2px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; grid-row: 1; grid-column: 2; }
.st.done { color: var(--ok); border-color: #1f5a3a; background: #11261b; }
.st.wip { color: var(--warn); border-color: #5b4f25; background: #272212; }
.st.missing { color: var(--bad); border-color: #6a2d34; background: #2a1518; }
.theme-line { font-family: var(--mono); font-size: 12px; color: var(--dim); background: #10131a; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; }

/* v1 options */
.opt { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 18px; }
.opt-head { display: flex; gap: 14px; align-items: flex-start; }
.letter { font-family: var(--display); font-weight: 700; font-size: 18px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent); flex: none; }
.opt h2 { font-size: 24px; margin-bottom: 4px; }
.world { color: var(--dim); max-width: 72ch; }
.world b { color: var(--fg); font-weight: 600; }
.opt-body { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 22px; align-items: center; }
.ohero { display: grid; justify-items: center; gap: 8px; }
.ohero canvas { width: 220px; height: 220px; max-width: 100%; }
.plate { font-family: var(--mono); font-size: 12px; color: var(--dim); text-align: center; }
.ladder { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.otier { margin: 0; display: grid; justify-items: center; gap: 6px; }
.otier .slot { width: 100%; aspect-ratio: 1; max-width: 96px; display: grid; place-items: center; }
.otier canvas { width: 84px; height: 84px; max-width: 100%; }
.otier figcaption { font-size: 12px; color: var(--dim); }
.sets { color: var(--dim); font-size: 13.5px; }
.sets span { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-right: 10px; }
.note { color: var(--dim); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; max-width: 80ch; }

/* full view */
.fv { position: fixed; inset: 0; z-index: 50; overflow: auto; backdrop-filter: blur(12px) brightness(.72); -webkit-backdrop-filter: blur(12px) brightness(.72); background: rgba(10, 9, 8, .45); display: grid; place-items: center; }
.fv-main { display: flex; gap: 28px; align-items: center; justify-content: center; padding: 56px 72px; width: 100%; }
.fv-x { position: fixed; top: 14px; right: 16px; z-index: 3; width: 42px; height: 42px; border-radius: 50%; border: 1px solid #4a525e; background: rgba(21, 24, 29, .85); font-size: 18px; cursor: pointer; }
.fv-nav { position: fixed; top: 50%; z-index: 3; width: 46px; height: 64px; margin-top: -32px; border-radius: 12px; border: 1px solid #4a525e; background: rgba(21, 24, 29, .85); font-size: 30px; line-height: 1; cursor: pointer; }
.fv-nav.prev { left: 12px; } .fv-nav.next { right: 12px; }
.fv-stage { position: relative; width: var(--S); height: var(--S); flex: none; perspective: 1000px; }
.fv-slab { position: absolute; inset: 0; transform-style: preserve-3d; outline-offset: 6px; border-radius: 18px; cursor: pointer; }
.fv-front, .fv-back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.fv-front { transform: translateZ(calc(var(--T) / 2)); }
.fv-front canvas { width: 100%; height: 100%; }
.fv-stage.is3d .fv-slab { cursor: grab; touch-action: none; }
.fv-stage.is3d .fv-slab:active { cursor: grabbing; }
.fv-stage.is3d .fv-front { transform: none; }
.fv-glare { position: absolute; inset: 2%; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at var(--gx, 30%) var(--gy, 20%), rgba(255, 255, 255, .16), transparent 55%); }
.fv-glare.b { inset: 0; }
.fv-back { transform: rotateY(180deg) translateZ(calc(var(--T) / 2)); }
.fv-edge { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
.fv-edge i { position: absolute; inset: 0; background-size: 100% 100%; }
.fv-floor { position: absolute; left: 50%; bottom: -8%; width: 70%; height: 8%; margin-left: -35%; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0, 0, 0, .55), transparent 70%); pointer-events: none; }
.fv-card { width: min(340px, 100%); background: rgba(21, 24, 29, .88); border: 1px solid #3a424e; border-radius: 14px; padding: 18px; display: grid; gap: 8px; }
.fv-card h2 { font-size: 24px; }

<script>
/* Live materials for earned tiers 1-6 (reference gem.js, maths unchanged). One shared WebGL context draws every <canvas class="ach-gemgl" data-kind="bronze|silver|gold|platinum|dia|ruby" data-icon="...">.
   data-shape="round" (THE THEME, v2 Uptime Medals): a struck round medal (polished rim, spun face with fine rings, icon engraved) for metals and the round brilliant for Diamond / Ruby.
   Shapes plaque / award are kept for the earlier theme options (v1). uTilt (YTPMGem.set(c, {tilt})) moves the studio lights with the full view's pointer tilt.
   60 fps. YTPMGem.only(canvas) draws only that canvas (the full view) while the rest hold still. data-dpr caps the pixel ratio.
   No network. Pauses off screen and in a hidden tab; one still frame with "reduce motion". No WebGL: the parent gets .is-nogl. */
(function (root) {
  'use strict';
  const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const FS = `
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform float uSeed; uniform float uKind; uniform sampler2D uIcon; uniform float uIconOn; uniform float uPx; uniform sampler2D uDet; uniform float uDetOn; uniform vec2 uTilt;
const float PI=3.14159265;
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
// studio: soft ceiling, strip lights round the side that turn slowly, hard spots for sparkle,
// and the viewer's own dark head straight above (this gives a brilliant its black-and-white mosaic)
float env(vec3 d, float t){
  d.xy=rot(t*.23)*d.xy;
  float az=atan(d.y,d.x);
  float s=.03+.45*smoothstep(-.1,.9,d.z);
  s+=1.1*pow(max(cos(az*3.)*.5+.5,0.),5.)*smoothstep(-.2,.5,d.z)*smoothstep(.98,.75,d.z);
  s+=pow(max(dot(d,normalize(vec3(.55,.55,.63))),0.),60.)*7.;
  s+=pow(max(dot(d,normalize(vec3(-.72,.25,.64))),0.),40.)*4.;
  s+=pow(max(dot(d,normalize(vec3(.05,-.78,.62))),0.),80.)*6.;
  s*=1.-.95*smoothstep(.94,.985,d.z);
  return s;
}
// light that enters through a facet (normal n), bounces off two pavilion mains and leaves through the crown.
// Worked out once per facet (from its centre c), so every facet is one clean flat tone, like a real stone.
float inner(vec2 c, vec3 v, vec3 n, float ior, float t){
  vec3 T=refract(-v,n,1./ior);
  if(dot(T,T)<.01) return 0.;
  vec2 q=c+T.xy*.7;
  float az=atan(q.y,q.x);
  float ps=(floor(az/(PI/4.))+.5)*(PI/4.);
  float th=radians(40.8);
  vec3 np=vec3(cos(ps)*sin(th),sin(ps)*sin(th),-cos(th));
  vec3 D1=reflect(T,np);
  vec2 q2=q+D1.xy*.8;
  float az2=atan(q2.y,q2.x);
  float ps2=(floor(az2/(PI/4.))+.5)*(PI/4.);
  vec3 np2=vec3(cos(ps2)*sin(th),sin(ps2)*sin(th),-cos(th));
  vec3 D2=reflect(D1,np2);
  if(D2.z<=0.) return .02;
  vec3 O=refract(D2,vec3(0.,0.,-1.),ior);
  if(dot(O,O)<.01) return .05;
  return env(normalize(O),t);
}
// ---- struck metal medals (tiers 1-4): polished raised rim, spun face with fine rings, icon engraved (frosted floor, bright cut walls)
uniform vec3 uMetal;
float envM(vec3 d, float t){
  d.xy=rot(t*.25)*d.xy;
  float s=.10+.30*smoothstep(-.3,1.,d.z);
  s+=1.5*pow(max(dot(d,normalize(vec3(.5,.45,.75))),0.),9.);
  s+=.7*pow(max(dot(d,normalize(vec3(-.65,-.25,.7))),0.),14.);
  s+=.35*smoothstep(.2,-.4,d.y)*smoothstep(-.6,.3,d.z);
  s+=4.*pow(max(dot(d,normalize(vec3(.45,.55,.7))),0.),220.);
  return s;
}
float icA(vec2 p){ vec2 iu=p/.66*.5+.5; return texture2D(uIcon,vec2(iu.x,1.-iu.y)).a; }
// studio for the metals: a dark room with a big softbox up left (close to the camera, so the face catches part of it),
// a tall strip light right, a warm floor bounce, a thin horizon line and one hard glint. Moves with the full view's tilt.
float envS(vec3 d, float t){
  d.xy=rot(.12*sin(t*.21)+uTilt.x*.8)*d.xy;
  d.yz=rot(uTilt.y*.6+.04*sin(t*.17))*d.yz;
  float s=.09+.12*smoothstep(-.2,.9,d.y);
  vec3 a=normalize(vec3(-.42,.46,.78));
  vec3 ux=normalize(cross(vec3(0.,0.,1.),a)), uy=cross(a,ux);
  float ca=dot(d,a);
  if(ca>0.){ vec2 q=vec2(dot(d,ux),dot(d,uy))/ca; s+=2.6*smoothstep(.08,-.08,max(abs(q.x)-.55,abs(q.y)-.40))*(.8+.2*smoothstep(-.3,.3,q.y)); }
  vec3 b=normalize(vec3(.82,.0,.57)); float cb=dot(d,b);
  if(cb>0.){ vec3 bx=normalize(cross(vec3(0.,1.,0.),b)); vec2 q=vec2(dot(d,bx),d.y)/cb; s+=1.8*smoothstep(.05,-.05,max(abs(q.x)-.08,abs(q.y)-1.)); }
  s+=.32*smoothstep(-.05,-.7,d.y)*smoothstep(-.4,.2,d.z);
  s+=.25*exp(-pow((d.y+.1)/.03,2.))*smoothstep(-.5,.2,d.z);
  s+=9.*pow(max(dot(d,normalize(vec3(.3,.62,.72))),0.),700.);
  return s;
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
vec4 medal(vec2 p, float r, float aa, float t){
  vec3 base=uMetal;
  vec3 v=normalize(vec3(-p*.30,1.));                      // a near camera
  vec2 rd=r>1e-4?p/r:vec2(1.,0.);
  vec2 tg=vec2(-rd.y,rd.x);
  float RIM=.83;
  vec3 col;
  if(r>RIM){
    // polished raised rim: a rounded bead, then a crisp outer edge. Mirror finish: one sharp reflection.
    float x=clamp((r-RIM)/(.975-RIM),0.,1.);
    float sl=cos(x*PI)*1.25;
    sl=mix(sl,-2.6,smoothstep(.972,.99,r));
    vec3 n=normalize(vec3(-rd*sl,1.));
    vec3 R=reflect(-v,n);
    float cv=clamp(dot(n,v),0.,1.);
    vec3 F=base+(1.-base)*pow(1.-cv,5.);
    col=F*envS(R,t);
    col*=1.-.45*smoothstep(.16,0.,x);                    // the face's shadow where the bead rises
  } else {
    // spun face, very slightly domed: the rings smear each reflection along the radius (the bow-tie of real spun metal)
    vec3 n=normalize(vec3(p*.22,1.));
    float ring=sin(r*uPx*.9)*.5+.5;
    n=normalize(n+vec3(rd*(ring-.5)*.012,0.));
    float e=0.;
    for(int k=0;k<4;k++){ float o=(float(k)-1.5)/1.5; e+=envS(reflect(-v,normalize(n+vec3(rd*o*.28,0.))),t); }
    e*=.25;
    float cv=clamp(dot(n,v),0.,1.);
    vec3 F=base+(1.-base)*pow(1.-cv,5.);
    col=F*e*.92;
    col*=1.-.35*smoothstep(RIM-.12,RIM,r);              // occlusion under the rim
  }
  // a fine groove where the rim meets the face
  col*=1.-smoothstep(aa*1.5,0.,abs(r-RIM))*.7;
  // engraved icon: sunken, sandblasted floor (matte, darker) and polished walls that catch the studio
  if(uIconOn>0. && r<RIM){
    float d=1.6/max(uPx,40.);
    float m=icA(p);
    float gx=icA(p+vec2(d,0.))-icA(p-vec2(d,0.));
    float gy=icA(p+vec2(0.,d))-icA(p-vec2(0.,d));
    if(m+abs(gx)+abs(gy)>0.){
      float grain=.85+.3*hash(floor(gl_FragCoord.xy));
      float diff=.10+.10*envS(vec3(-.35,.4,.85),t);
      vec3 floorC=base*diff*grain;
      col=mix(col,floorC,smoothstep(.15,.85,m));
      vec3 nw=normalize(vec3(vec2(gx,gy)*2.2,1.));
      float w=clamp(length(vec2(gx,gy))*1.6,0.,1.);
      vec3 Rw=reflect(-v,nw);
      col=mix(col,base*envS(Rw,t)*1.1,w*.9);
    }
  }
  float inside=smoothstep(1.+aa,1.-aa,r);
  col=aces(col*1.1);
  return vec4(col*inside,inside);
}

    const next = L.th[t], prev = t ? L.th[t - 1] : 0;
    return { t, next, prev, frac: clamp((L.n - prev) / (next - prev), 0, 1) };
  }

    is3d: false, yaw: 0, pitch: -18, vy: 0, vp: 0, drag: null, dragged: 0, turn: 0, turnT: 0, lastDrag: 0 };
  // Diamond, Ruby and Emulsion turn as real 3D objects in the full view (ray traced); the metal medals keep the struck slab with its spec-sheet back
  const showcaseList = () => TIER.map((n, i) => ({ id: 'tier' + i, kind: 'showcase', title: n + ' medal', line: i === 6 ? 'The live soap bubble, the rarest thing in the tool.' : `What a ${n} medal looks like. Every ladder badge climbs to it.`, tier: i + 1, icon: 'clock', earned: true }));
  function stageSize(bub) {
    const w = window.innerWidth, h = window.innerHeight, narrow = w <= 760;
    let s = narrow ? Math.min(w * .88, h * .46) : Math.min(w * .44, h * .76);
    s = Math.min(s, 600);
    return Math.max(210, Math.round(s));
  }
  function backHtml(e, bub) {
    const earned = e.kind === 'showcase' ? 'Preview' : e.kind === 'single' ? demoDate(e.id, 0) : demoDate(e.id, e.tier - 1);
    return `<div class="cardback${bub ? ' b' : ''}" data-tier="${e.tier}"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4.6l2-3.7 1.8 7.3 1.8-8.6 1.7 5H21"/></svg>Resource Monitor</div>
      <div class="kick">Certificate of achievement</div><div class="ttl">${esc(e.title)}</div><div class="for">${esc(e.kind === 'ladder' ? e.line : e.line)}</div>
      <dl><div><dt>Tier</dt><dd>${TIER[e.tier - 1]}</dd></div><div><dt>Earned</dt><dd>${esc(earned)}</dd></div><div><dt>No.</dt><dd>${certNo(e.id, e.tier)}</dd></div></dl>
      <div class="nt">Earned by using Resource Monitor, never bought. Only confirmed changes count.</div><div class="ft">Resource Monitor by Rajhans</div></div>`;
  }
  function cardHtml(e) {
    let notes = '';
    if (e.kind === 'ladder') {
      for (let i = 0; i < e.tier; i++) notes += `<li><b>${TIER[i]}</b> · ${demoDate(e.id, i)}</li>`;
      notes += `<li>Your count: <b>${fmt(e.L.n)}</b> ${esc(e.L.what)}</li>`;
      notes += `<li>${e.tier < 6 ? `Next: <b>${TIER[e.tier]}</b> at ${fmt(e.s.next)}` : 'Emulsion: gate shut'}</li>`;
    } else if (e.kind === 'single') notes = `<li>Earned <b>${demoDate(e.id, 0)}</b></li><li>+${e.B.xp} XP</li>`;
    else notes = '<li>A preview of the tier, not an earned badge.</li>';
    return `<div class="fv-count">${FV.i + 1} of ${FV.list.length}</div><div class="mt" style="color:${THEX[e.tier - 1]}">Uptime · ${TIER[e.tier - 1]}</div><h2>${esc(e.title)}</h2><p class="ln">${esc(e.line)}</p>${pipsHtml(e.tier)}<ul>${notes}</ul><p class="hint">${FV.is3d ? 'Drag to turn it any way, like holding it. Click, Enter or Space turns it over. ← → go through the list, Esc closes.' : 'Tilt with the pointer. Click, Enter or Space turns the medal to its spec sheet. ← → go through the list, Esc closes.'}</p>`;
  }
  function renderFV() {
    const e = FV.list[FV.i], bub = e.tier === 7, S = stageSize(bub);
    FV.bubble = bub;
    stage.style.setProperty('--S', S + 'px'); stage.style.setProperty('--T', (S * .034).toFixed(1) + 'px');
    try { YTPM3D.stop(); } catch (err) { /* ignore */ }
    FV.is3d = false;
    if (e.tier >= 5 && window.YTPM3D) {
      const c = document.createElement('canvas'), px = Math.round(Math.min(S * Math.min(window.devicePixelRatio || 1, 1.5), 900));
      c.width = c.height = px; c.className = 'ach-3d'; c.setAttribute('aria-hidden', 'true');
      front.innerHTML = ''; front.appendChild(c);
      FV.is3d = YTPM3D.start(c, e.tier === 7 ? 'bubble' : e.tier === 6 ? 'ruby' : 'dia', reduced());
    }
    stage.classList.toggle('is3d', FV.is3d);
    if (FV.is3d) {
      back.innerHTML = ''; edge.innerHTML = '';
      FV.yaw = 0; FV.pitch = bub ? 0 : -24; FV.vy = FV.vp = 0; FV.turn = FV.turnT = 0; FV.lastDrag = 0;
      slab.setAttribute('aria-label', `${e.title}, ${TIER[e.tier - 1]}. Drag to turn it in 3D; Enter or Space turns it over`);
      card.innerHTML = cardHtml(e);
      card.classList.toggle('has-tune', bub);
      if (bub) tnSidePanel(card);
      $('#fvP').hidden = $('#fvN').hidden = FV.list.length < 2;
      FV.canvas = null;
      apply();
      return;
    }
    front.innerHTML = cv({ tier: e.tier, icon: e.icon, size: S, dpr: 2 }) + `<div class="fv-glare${bub ? ' b' : ''}"></div>`;
    back.innerHTML = backHtml(e, bub);
    edge.innerHTML = '';
    FV.flip = FV.flipT = 0;
    slab.setAttribute('aria-label', `${e.title}, ${TIER[e.tier - 1]}. Click to turn the medal over to its spec sheet`);
    card.innerHTML = cardHtml(e);
    card.classList.toggle('has-tune', bub);
    if (bub) tnSidePanel(card);
    $('#fvP').hidden = $('#fvN').hidden = FV.list.length < 2;
    FV.canvas = $('canvas', front);
    mountIn(front);
    try { YTPMGem.only(FV.canvas); YTPMBubble.only(FV.canvas); } catch (err) { /* ignore */ }
    clearTimeout(FV.edgeT);
    FV.edgeT = setTimeout(() => makeEdge(FV.canvas), 350);
    apply();
  }
  function makeEdge(c) {   // 12 darkened copies of the outline along Z (made once from the first frame, no live CSS filters)
    try {
      const N = 256, a = document.createElement('canvas'); a.width = a.height = N;
      const g = a.getContext('2d'); g.drawImage(c, 0, 0, N, N);
      const base = g.getImageData(0, 0, N, N), urls = [.5, .36, .28].map((f) => {
        const out = g.createImageData(N, N), s = base.data, d = out.data;
        for (let i = 0; i < s.length; i += 4) { d[i] = s[i] * f; d[i + 1] = s[i + 1] * f; d[i + 2] = s[i + 2] * f; d[i + 3] = s[i + 3]; }
        const b = document.createElement('canvas'); b.width = b.height = N; b.getContext('2d').putImageData(out, 0, 0); return b.toDataURL('image/png');
      });
      const T = parseFloat(getComputedStyle(stage).getPropertyValue('--T')) || 10;
      let h = '';
      for (let k = 0; k < 12; k++) h += `<i style="background-image:url(${urls[Math.min(2, Math.floor(k / 4))]});transform:translateZ(${(T / 2 - (k + 1) * T / 13).toFixed(2)}px)"></i>`;
      edge.innerHTML = h;
    } catch (err) { edge.innerHTML = ''; }
  }
  function apply() {
    if (FV.is3d) {
      slab.style.transform = 'none';
      floor.style.transform = 'none';
      try { YTPM3D.rot(FV.yaw + FV.ry * .6, FV.pitch + FV.turn - FV.rx * .6, 0); } catch (err) { /* ignore */ }
      return;
    }
    slab.style.transform = `rotateX(${FV.rx.toFixed(2)}deg) rotateY(${(FV.flip + FV.ry).toFixed(2)}deg)`;
    const gl = $('.fv-glare', front);
    if (gl) { gl.style.setProperty('--gx', (50 + FV.ry / 22 * 40).toFixed(1) + '%'); gl.style.setProperty('--gy', (35 - FV.rx / 16 * 30).toFixed(1) + '%'); }
    const rad = (FV.flip + FV.ry) * Math.PI / 180;
    floor.style.transform = `translateX(${(FV.ry * 1.2).toFixed(1)}px) scaleX(${(1 - .28 * Math.abs(Math.sin(rad))).toFixed(3)})`;
    if (FV.canvas && !FV.bubble && FV.canvas.dataset.live === '1') { try { YTPMGem.set(FV.canvas, { tilt: [FV.ry / 22 * .5, FV.rx / 16 * .5] }); } catch (err) { /* ignore */ } }
  }
  function tick(ts) {
    FV.raf = requestAnimationFrame(tick);
    const dt = Math.min(.05, (ts - (FV.last || ts)) / 1000); FV.last = ts;
    let tx, ty;
    if (FV.px !== null && ts - FV.moved < 4000) {
      const r = stage.getBoundingClientRect();
      ty = clamp((FV.px - (r.left + r.width / 2)) / (window.innerWidth / 2), -1, 1) * 22;
      tx = -clamp((FV.py - (r.top + r.height / 2)) / (window.innerHeight / 2), -1, 1) * 16;
    } else { const t = ts / 1000, sw = FV.bubble ? (+YTPMLook.turn || 0) / 9 : 1; tx = 3.5 * sw * Math.sin(.7 * t); ty = 9 * sw * Math.sin(.5 * t); }
    const k = 1 - Math.exp(-dt * 16);
    FV.rx += (tx - FV.rx) * k; FV.ry += (ty - FV.ry) * k;
    FV.flip += (FV.flipT - FV.flip) * (1 - Math.exp(-dt * 6.5));
    if (Math.abs(FV.flipT - FV.flip) < .05) FV.flip = FV.flipT;
    if (FV.is3d) {
      if (!FV.drag) {
        FV.yaw += FV.vy * dt; FV.pitch += FV.vp * dt;                  // a flick keeps turning, then slows
        const fr = Math.exp(-dt * 2.2); FV.vy *= fr; FV.vp *= fr;
        if (ts - FV.lastDrag > 2500 && !FV.bubble) FV.yaw += 14 * dt;   // left alone: stones turn slowly; the bubble only sways
      }
      FV.turn += (FV.turnT - FV.turn) * (1 - Math.exp(-dt * 5));
      if (FV.drag) { FV.rx *= .9; FV.ry *= .9; }
    }
    apply();
  }
  function flipIt() {
    if (FV.is3d) { if (Date.now() - FV.dragged < 250) return; FV.turnT += 180; if (reduced()) { FV.turn = FV.turnT; apply(); } return; }
    FV.flipT = FV.flipT === 0 ? 180 : 0;
    if (reduced()) { FV.flip = FV.flipT; apply(); }
  }
  function openFV(list, i, opener) {
    closeOverlays(); tnStop();
    FV.list = list; FV.i = clamp(i, 0, list.length - 1); FV.opener = opener || document.activeElement; FV.openedAt = Date.now();
    fv.hidden = false; document.documentElement.setAttribute('data-ach-hold', '');
    document.body.style.overflow = 'hidden';
    FV.rx = FV.ry = 0; FV.px = null;
    renderFV();
    if (!reduced()) { FV.last = 0; FV.raf = requestAnimationFrame(tick); }
    slab.focus();
  }
  function closeFV() {
    if (fv.hidden) return;
    fv.hidden = true; cancelAnimationFrame(FV.raf); FV.raf = 0; clearTimeout(FV.edgeT);
    document.documentElement.removeAttribute('data-ach-hold'); document.body.style.overflow = '';
    try { YTPMGem.only(null); YTPMBubble.only(null); YTPM3D.stop(); } catch (err) { /* ignore */ }
    FV.is3d = false; stage.classList.remove('is3d');
    front.innerHTML = ''; back.innerHTML = ''; edge.innerHTML = ''; FV.canvas = null;
    if (FV.opener && FV.opener.isConnected) FV.opener.focus();
    if (cur === 'v4') requestAnimationFrame(tnStart);
  }
  function stepFV(d) { if (FV.list.length < 2) return; FV.i = (FV.i + d + FV.list.length) % FV.list.length; renderFV(); }
  fv.addEventListener('pointermove', (ev) => { FV.px = ev.clientX; FV.py = ev.clientY; FV.moved = performance.now(); });
  fv.addEventListener('pointerleave', () => { FV.px = null; });
  fv.addEventListener('click', (ev) => { if (ev.target === fv || ev.target.id === 'fvMain') closeFV(); });
  slab.addEventListener('click', flipIt);
  slab.addEventListener('pointerdown', (ev) => {
    if (!FV.is3d) return;
    FV.drag = { x: ev.clientX, y: ev.clientY, t: performance.now(), sx: ev.clientX, sy: ev.clientY };
    FV.vy = FV.vp = 0;
    try { slab.setPointerCapture(ev.pointerId); } catch (err) { /* ignore */ }
  });
  slab.addEventListener('pointermove', (ev) => {
    const g = FV.drag; if (!FV.is3d || !g) return;
    const now = performance.now(), dx = ev.clientX - g.x, dy = ev.clientY - g.y, k = 300 / Math.max(200, stage.clientWidth);
    FV.yaw += dx * k; FV.pitch -= dy * k;
    const dt = Math.max(8, now - g.t) / 1000;
    FV.vy = FV.vy * .5 + (dx * k / dt) * .5; FV.vp = FV.vp * .5 + (-dy * k / dt) * .5;
    g.x = ev.clientX; g.y = ev.clientY; g.t = now; FV.lastDrag = now;
    if (Math.hypot(ev.clientX - g.sx, ev.clientY - g.sy) > 5) FV.dragged = Date.now();
    if (reduced()) apply();
  });
  const endDrag = () => { if (!FV.drag) return; if (performance.now() - FV.drag.t > 80) FV.vy = FV.vp = 0; FV.drag = null; FV.lastDrag = performance.now(); };
  slab.addEventListener('pointerup', endDrag); slab.addEventListener('pointercancel', endDrag);
  $('#fvX').addEventListener('click', closeFV);
  $('#fvP').addEventListener('click', () => stepFV(-1));
  $('#fvN').addEventListener('click', () => stepFV(1));

  /* ------------------------------------------------------------------ moments */
  const mo = $('#mo'), lu = $('#lu');
  const MOMENTS = [
    { eyebrow: 'Badge upgraded', title: 'Watchkeeper', tier: 4, icon: 'clock', line: '1,000 active hours watched', xp: 250, more: '+1 more badge · Level 12 reached' },
    { eyebrow: 'Unlocked', title: 'First Gigabyte', tier: 1, icon: 'box', line: '1 GB of traffic tracked.', xp: 25, more: '' },
    { eyebrow: 'Badge upgraded', title: 'Data Mover', tier: 6, icon: 'disk', line: '100,000 GB read and written to disk', xp: 1500, more: '+2 more badges · New rank: Ruby' }
  ];
  let momI = 0, moT = 0, moAt = 0, moOpener = null, luT = 0, luAt = 0, luOpener = null;
  function openMoment(opener) {
    closeOverlays();
    const m = MOMENTS[momI++ % MOMENTS.length], S = Math.round(Math.min(300, window.innerWidth * .62));
    moOpener = opener; moAt = Date.now();
    mo.style.setProperty('--hc', THEX[m.tier - 1]); mo.style.setProperty('--MS', S + 'px');
    mo.innerHTML = `<div class="mo-box"><div class="mo-halo"></div><div class="mo-badge">${cv({ tier: m.tier, icon: m.icon, size: S })}</div>
      <div class="mo-t"><div class="eb">${m.eyebrow}</div><h2>${esc(m.title)}</h2><div class="mm" style="color:${THEX[m.tier - 1]}">${TIER[m.tier - 1]}</div><div class="ln">${esc(m.line)}</div><div><span class="xp">+${fmt(m.xp)} XP</span></div><div class="hint">Click, Esc, Enter or Space to close</div><div class="more">${esc(m.more)}</div></div></div><div class="mo-bar" aria-hidden="true"><i></i></div>`;
    mo.hidden = false; mountIn(mo); mo.focus();
    clearTimeout(moT); moT = setTimeout(closeMoment, 6000);
  }
  function closeMoment() { if (mo.hidden) return; clearTimeout(moT); mo.hidden = true; mo.innerHTML = ''; if (moOpener && moOpener.isConnected) moOpener.focus(); }
  function openLevel(opener) {
    closeOverlays();
    luOpener = opener; luAt = Date.now();
    lu.style.setProperty('--hc', THEX[3]);
    let rays = ''; for (let i = 0; i < 18; i++) rays += `<i class="ray" style="--i:${i};--a:${i * 20}deg"></i>`;
    lu.innerHTML = `${rays}<div class="lu-c"><div class="eb">Level up</div><div class="num">16</div><div class="tt">Engineer</div><div class="nr">New rank: Platinum</div></div>`;
    lu.hidden = false; lu.focus();
    clearTimeout(luT); luT = setTimeout(closeLevel, reduced() ? 1600 : 3200);
  }
  function closeLevel() { if (lu.hidden) return; clearTimeout(luT); lu.hidden = true; lu.innerHTML = ''; if (luOpener && luOpener.isConnected) luOpener.focus(); }
  function closeOverlays() { closeMoment(); closeLevel(); }
  mo.addEventListener('click', closeMoment); lu.addEventListener('click', closeLevel);

  document.addEventListener('keydown', (ev) => {
    if (!lu.hidden) { if (Date.now() - luAt > 300 && !ev.repeat) { ev.preventDefault(); closeLevel(); } return; }
    if (!mo.hidden) { if (Date.now() - moAt > 300 && !ev.repeat && ['Escape', 'Enter', ' '].includes(ev.key)) { ev.preventDefault(); closeMoment(); } return; }
    if (fv.hidden) return;
    if (ev.key !== 'Escape' && ev.target && ev.target.closest && ev.target.closest('input, button, .fv-tune')) return;
    if (ev.key === 'Escape') { ev.preventDefault(); closeFV(); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); stepFV(-1); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); stepFV(1); }
    else if ((ev.key === 'Enter' || ev.key === ' ') && ev.target === slab && !ev.repeat) { ev.preventDefault(); flipIt(); }
    else if (ev.key === 'Tab') {
      const f = [slab, $('#fvP'), $('#fvN'), $('#fvX')].filter((b) => !b.hidden), i = f.indexOf(document.activeElement);
      ev.preventDefault(); f[(i + (ev.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });
  window.addEventListener('resize', () => {
    if (fv.hidden) return;
    const e = FV.list[FV.i], S = stageSize(e.tier === 7);
    stage.style.setProperty('--S', S + 'px'); stage.style.setProperty('--T', (S * .034).toFixed(1) + 'px');
  });

  /* ------------------------------------------------------------------ start */
  renderTabs();
  let start = VERSIONS[0].id;
  try { const h = (location.hash || '').slice(1); if (BUILDERS[h]) start = h; } catch (e) { /* ignore */ }
  show(start);
})();

</script>
